{% extends "layouts/base.html" %}

{% block title %}
Verify Email | {{ store_name }}
{% endblock %}

{% block extra_css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/pages/verify_otp.css') }}"
>

{% endblock %}

{% block content %}

<div class="verify-otp-page">

    <div class="verify-otp-card">

        <span class="verify-otp-label">
            EMAIL VERIFICATION
        </span>

        <h1>
            Verify your email
        </h1>

        <p>
            We sent a 6-digit verification code to:
        </p>

        <strong>
            {{ email }}
        </strong>


        <form
            method="POST"
            action="{{ url_for('auth.verify_otp') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <input
                type="hidden"
                name="email"
                value="{{ email }}"
            >

            <label for="otp">
                Verification Code
            </label>

            <input
                id="otp"
                type="text"
                name="otp"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                required
            >

            <button type="submit">
                Verify Email
            </button>

        </form>


        <p class="verify-otp-expiry">
            Your code expires in 10 minutes.
        </p>

    </div>

</div>

{% endblock %}
