{% extends "layouts/base.html" %}

{% block title %}Login | {{ store_name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1 class="auth-title">
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to continue shopping.
        </p>

        <form method="POST" class="auth-form">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <input
                class="form-input"
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                class="form-input"
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button class="btn btn-primary" type="submit">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Create Account
            </a>
            <a href="{{ url_for('auth.forgot_password') }}">
                Forgot Password?
            </a>

        </p>

    </div>

</section>

{% endblock %}
